    <script>
      const segment = location.pathname.replace(/\/+$/, '').split('/').pop();
      const experience = segment === 'original' ? 'original' : segment === 'hibrida' ? 'hybrid' : segment === 'comercial' ? 'commercial' : segment === 'versiones' ? 'versions' : '3d';
      const commercial = experience === 'commercial';
      document.documentElement.dataset.experience = experience;
      if (experience === '3d' || experience === 'hybrid') document.documentElement.dataset.universe = 'true';
      try {
        // Comercial keeps its own preference and starts in light, like Personal.
        const preference = JSON.parse(localStorage.getItem(commercial ? 'orbita-commercial-theme-v1' : 'supernova-theme-v1') || (commercial ? '"light"' : '"dark"'));
        const theme = preference === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = commercial && theme === 'light' ? '#F5F7FA' : '#030B1C';
      } catch { document.documentElement.style.colorScheme = 'dark'; }
    </script>
    <style>
      /* Comercial has no space intro: hide the critical solar frame until React removes it. */
      html[data-experience='commercial'] :is(#intro-bootstrap, #intro-bootstrap-note) { display: none !important; }
      html[data-experience='commercial'][data-theme='light'], html[data-experience='commercial'][data-theme='light'] body { background: #f5f7fa !important; }
    </style>

<style id="tour-nebula-bootstrap-style">/* Órbita night: recolored Tour image (navy/blue, cyan glows, a hint of violet/magenta). Same timings, positions and host. */
#tour-nebula-backdrop { display: none; }
html:is([data-experience='3d'], [data-experience='hybrid']) #tour-nebula-backdrop {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  isolation: isolate;
  pointer-events: none;
  background: #030b1c;
}
html:is([data-experience='3d'], [data-experience='hybrid']) #root { position: relative; z-index: 1; }
#tour-nebula-backdrop .tour-nebula-layers {
  position: absolute;
  inset: 0;
  will-change: transform;
  animation: tour-nebula-drift 18s ease-in-out infinite;
}
#tour-nebula-backdrop .tour-nebula-parallax {
  position: absolute;
  inset: 0;
}
#tour-nebula-backdrop .tour-nebula-image {
  position: absolute;
  inset: -4%;
  width: 108%;
  height: 108%;
  max-width: none;
  object-fit: cover;
  filter: brightness(.85) saturate(1.05);
  transform: scale(1.02);
  animation: tour-nebula-zoom-in 2s cubic-bezier(.4, 0, .2, 1) both;
}
#tour-nebula-backdrop .tour-nebula-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(35, 72, 222, .4) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 15% 60%, rgba(30, 178, 245, .16) 0%, transparent 50%),
    radial-gradient(ellipse 40% 55% at 88% 65%, rgba(224, 71, 158, .1) 0%, transparent 50%);
  animation: tour-nebula-breathe 5s ease-in-out infinite alternate;
}
#tour-nebula-backdrop .tour-nebula-stars,
#tour-nebula-backdrop .tour-nebula-particles { position: absolute; inset: 0; width: 100%; height: 100%; }
#tour-nebula-backdrop .tour-nebula-stars > circle { fill: #eef5ff; }
#tour-nebula-backdrop .tour-nebula-particle {
  position: absolute;
  width: .4rem;
  height: .4rem;
  border-radius: 999px;
  opacity: .45;
  animation: tour-nebula-particle-float 7s ease-in-out infinite;
}
#tour-nebula-backdrop .tour-nebula-particle[data-tone='cyan'] { background: #4ec5ff; box-shadow: 0 0 .8rem #4ec5ff; }
#tour-nebula-backdrop .tour-nebula-particle[data-tone='blue'] { background: #4d7cff; box-shadow: 0 0 .8rem #4d7cff; }
#tour-nebula-backdrop .tour-nebula-particle[data-tone='violet'] { background: #7b6cf6; box-shadow: 0 0 .8rem #7b6cf6; }

#tour-nebula-backdrop .tour-nebula-particle-1 { top: 18%; left: 12%; animation-duration: 6s; }
#tour-nebula-backdrop .tour-nebula-particle-2 { top: 30%; right: 14%; animation-duration: 5s; animation-delay: -1.5s; }
#tour-nebula-backdrop .tour-nebula-particle-3 { bottom: 22%; left: 18%; animation-duration: 7s; animation-delay: -2.5s; }
#tour-nebula-backdrop .tour-nebula-particle-4 { bottom: 28%; right: 20%; animation-duration: 5.5s; animation-delay: -.8s; }
#tour-nebula-backdrop .tour-nebula-particle-5 { top: 48%; left: 8%; animation-duration: 8s; animation-delay: -3.5s; }

#tour-nebula-backdrop:not([data-motion='running']) .tour-nebula-layers,
#tour-nebula-backdrop:not([data-motion='running']) .tour-nebula-image,
#tour-nebula-backdrop:not([data-motion='running']) .tour-nebula-glow,
#tour-nebula-backdrop:not([data-motion='running']) .tour-nebula-particle,
html:not([data-experience='3d']):not([data-experience='hybrid']) #tour-nebula-backdrop * { animation-play-state: paused !important; }

@keyframes tour-nebula-drift {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
  25% { transform: translate3d(-2.8%, 2.2%, 0) scale(1.055) rotate(.45deg); }
  50% { transform: translate3d(-2%, -1.8%, 0) scale(1.07) rotate(-.3deg); }
  75% { transform: translate3d(2%, 1.2%, 0) scale(1.045) rotate(.2deg); }
}
@keyframes tour-nebula-zoom-in { from { transform: scale(1.08); } to { transform: scale(1.02); } }
@keyframes tour-nebula-breathe { from { opacity: .55; transform: scale(1); } to { opacity: 1; transform: scale(1.06); } }
@keyframes tour-nebula-particle-float {
  0%, 100% { transform: translateY(-28px) translateX(0); opacity: .2; }
  33% { transform: translateY(8px) translateX(10px); opacity: .65; }
  66% { transform: translateY(22px) translateX(-8px); opacity: .45; }
}
@media (prefers-reduced-motion: reduce) {
  #tour-nebula-backdrop * { animation-play-state: paused !important; }
}</style>

<script>
(() => {
  const backdrop = document.getElementById('tour-nebula-backdrop');
  let paused = false;
  try { paused = JSON.parse(localStorage.getItem('supernova-universe-motion-v1') || 'false') === true; } catch {}

<style id="intro-bootstrap-style">/* Keep the honest loading state on Órbita's night navy even if the app's CSS has not arrived. */
html:has(#intro-bootstrap), body:has(#intro-bootstrap) { background: #030b1c; }
/* Órbita palette (docs/orbita/README.md): the intro is always night. */
.cinematic-intro {
  --intro-bg: #030b1c;
  --intro-fg: #eef5ff;
  --intro-muted: #9fb3d1;
  --intro-caption: #8499bc;
  --intro-star: #dcebff;
  --intro-accent: #4ec5ff;
  --intro-spark: #e0479e;
  --intro-start-delay: 0s;
  --intro-handoff-delay: 0s;
  --intro-handoff-duration: .2s;
  position: fixed;
  inset: 0;
  z-index: 10000;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: var(--intro-fg);
  background: transparent;
  font-family: Manrope, sans-serif;
  isolation: isolate;
  outline: none;
}
.intro-static-sky { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.intro-backdrop { position: absolute; inset: 0; background: var(--intro-bg); }
.intro-stars { position: absolute; inset: 0; }
.intro-stars i { position: absolute; border-radius: 50%; background: var(--intro-star); }
.intro-stars i:nth-child(9n) { background: var(--intro-accent); }
.intro-stars i:nth-child(23n) { background: var(--intro-spark); }
.intro-composition {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(560px, calc(100vw - 48px));
  transform: translateY(-8px);
}
.intro-orbital-system { position: relative; width: 100%; height: 330px; }
.intro-orbital-map { display: block; width: 100%; height: 100%; overflow: visible; }
.intro-orbital-label {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  color: var(--intro-caption);
  font-size: 8px;
  letter-spacing: 2.3px;
  white-space: nowrap;
}
.intro-identity { margin-top: 27px; text-align: center; }
.intro-brand-lockup { width: 100%; }
.intro-wordmark-mask { overflow: hidden; padding-bottom: 13px; margin-bottom: -13px; }
/* «órbita» is short: a larger size and gentler tracking keep the lockup's
   presence. Manrope 400 is the face preloaded for the HTML first frame. */
.intro-wordmark { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 80px; font-weight: 400; line-height: 1.15; letter-spacing: -.05em; white-space: nowrap; }
.intro-brand-symbol { width: 50px; height: 50px; flex: none; color: var(--intro-accent); }
.intro-tagline { margin-top: 8px; color: var(--intro-muted); font-size: 15px; font-weight: 400; letter-spacing: -.025em; }
.intro-caption {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-top: 45px;
  color: var(--intro-caption);
  font-size: 9px;
  letter-spacing: 2.2px;
  white-space: nowrap;
}
.intro-caption > span { width: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--intro-caption)); opacity: .45; }
.intro-caption > span:last-child { transform: rotate(180deg); }
.intro-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* The renderer holds the SVG map pose through 1.2 s. Transfer its aligned map
   during 1.0–1.2 s, then let the single Earth begin the camera's zoom.
   Fade parents only: GSAP owns the child transforms/opacity. */
.intro-revealing .intro-static-sky,
.intro-revealing .intro-orbital-system { animation: intro-handoff var(--intro-handoff-duration) ease-in-out var(--intro-handoff-delay) both; }
@keyframes intro-handoff { from { opacity: 1; } to { opacity: 0; } }

/* Same finite first-frame choreography while the animation chunk is pending. */
.intro-pending [data-intro='orbits'] { transform-origin: 240px 185px; animation: intro-pending-orbits 3.6s cubic-bezier(.22, 1, .36, 1) var(--intro-start-delay) both; }
.intro-pending [data-intro='radiance'] { animation: intro-pending-radiance 3.6s ease-in-out var(--intro-start-delay) both; }
.intro-pending [data-intro='wordmark'] { animation: intro-pending-wordmark 3.6s cubic-bezier(.22, 1, .36, 1) var(--intro-start-delay) both; }
.intro-pending [data-intro='tagline'] { animation: intro-pending-tagline 3.6s cubic-bezier(.22, 1, .36, 1) var(--intro-start-delay) both; }
.intro-pending [data-intro='caption'] { animation: intro-pending-caption 3.6s ease-out var(--intro-start-delay) both; }
.intro-pending [data-intro='identity'] { animation: intro-pending-identity 3.6s ease-in-out var(--intro-start-delay) both; }
.intro-pending [data-intro='composition'] { animation: intro-pending-composition 3.6s ease-in var(--intro-start-delay) both; }
.intro-pending { animation: intro-pending-exit 3.6s ease-in-out var(--intro-start-delay) both; }
@keyframes intro-pending-orbits { 0% { opacity: .72; transform: rotate(-2deg); } 33%, 100% { opacity: 1; transform: rotate(0deg); } }
@keyframes intro-pending-radiance { 0% { opacity: .7; } 33%, 100% { opacity: 1; } }
@keyframes intro-pending-wordmark { 0%, 10% { opacity: 0; transform: translateY(65%); } 28%, 100% { opacity: 1; transform: translateY(0); } }
@keyframes intro-pending-tagline { 0%, 19% { opacity: 0; transform: translateY(6px); } 36%, 100% { opacity: 1; transform: translateY(0); } }
@keyframes intro-pending-caption { 0%, 26% { opacity: 0; } 44%, 100% { opacity: 1; } }
@keyframes intro-pending-identity { 0%, 53% { opacity: 1; transform: translateY(0); } 74%, 100% { opacity: 0; transform: translateY(-8px); } }
@keyframes intro-pending-composition { 0%, 78% { opacity: 1; } 89%, 100% { opacity: 0; } }
@keyframes intro-pending-exit { 0%, 90% { opacity: 1; } 100% { opacity: 0; } }

/* HTML must release its fullscreen art without React. The loading note does

#intro-bootstrap { animation: intro-bootstrap-release 3.6s linear both; }
#intro-bootstrap-note {
  position: fixed;
  z-index: 9999;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 48px);
  margin: 0;
  color: #9fb3d1;
  background: #030b1c;
  font: 12px/1.5 Manrope, sans-serif;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  animation: intro-bootstrap-note 3.6s linear both;
}
#intro-bootstrap-note span { display: block; font-size: 10px; color: #7f93b5; margin-top: 4px; }
@keyframes intro-bootstrap-release { 0%, 95% { opacity: 1; } 100% { opacity: 0; pointer-events: none; visibility: hidden; } }
@keyframes intro-bootstrap-note { 0%, 99.9% { opacity: 0; } 100% { opacity: 1; } }

@media(max-width:600px) {

  .intro-orbital-system { height: 270px; }
  .intro-orbital-label { font-size: 7px; letter-spacing: 1.6px; bottom: 4px; }

  .intro-brand-symbol { width: 39px; height: 39px; }
  .intro-caption { margin-top: 27px; }
}
@media(prefers-reduced-motion:reduce) {
  .intro-pending, .intro-pending [data-intro] { animation: none; }
  .intro-revealing .intro-static-sky, .intro-revealing .intro-orbital-system { animation-duration: .15s; animation-delay: 0s; }
  #intro-bootstrap { animation: intro-bootstrap-release .15s linear both; }
  #intro-bootstrap-note { animation-duration: .15s; }
}

<p id="intro-bootstrap-note" role="status">Preparando tu universo.<span>La aplicación todavía se está cargando.</span></p>
<script>
(() => {
  const bootstrap = document.getElementById('intro-bootstrap');
  const note = document.getElementById('intro-bootstrap-note');
  const startedAtMs = performance.now();
  bootstrap.setAttribute('data-intro-started-at', String(startedAtMs));
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const release = () => {
    bootstrap.setAttribute('data-intro-dismissed', 'true');
    bootstrap.setAttribute('aria-hidden', 'true');
    bootstrap.inert = true;
    bootstrap.style.opacity = '0';
    bootstrap.style.visibility = 'hidden';
    bootstrap.style.pointerEvents = 'none';
    if (note && bootstrap.isConnected) note.style.opacity = '1';
  };
  const timer = window.setTimeout(release, preference.matches ? 150 : 3600);
  const onKeyDown = event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      release();
    }
  };
  const onPreferenceChange = event => { if (event.matches) release(); };
  document.addEventListener('keydown', onKeyDown);
  preference.addEventListener('change', onPreferenceChange);
  const observer = new MutationObserver(() => {
    if (bootstrap.isConnected) return;
    window.clearTimeout(timer);
    document.removeEventListener('keydown', onKeyDown);
    preference.removeEventListener('change', onPreferenceChange);
    observer.disconnect();
    note?.remove();
  });
  observer.observe(document.body, { childList: true });
})();
</script>
